[project]
name = "langchain-middlewares"
version = "0.1.0"
description = "Simple LangChain demos for memory guardrails and model routing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "langchain==1.3.18",
    "langchain-openai==1.4.3",
    "langgraph==1.2.11",
    "langgraph-cli[inmem]==0.4.31",
    "regopy==1.5.2",
    "vllm-sr==0.3.0",
]

[project.optional-dependencies]
switchyard = ["nemo-switchyard==0.2.0"]
